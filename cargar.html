const $ = (id) => document.getElementById(id);
$('nC').textContent = DATA.conjuntos.length; $('nP').textContent = DATA.piezas.length;
const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
async function all(table, cols) { let out = [], f = 0; for (;;) { const { data, error } = await sb.from(table).select(cols).range(f, f + 999); if (error) throw error; out = out.concat(data); if (data.length < 1000) return out; f += 1000; } }
async function pool(items, n, fn) { let i = 0; await Promise.all(Array.from({ length: n }, async () => { while (i < items.length) { const k = i++; await fn(items[k], k); } })); }
async function retry(fn) { for (let t = 0; t < 3; t++) { const { error } = await fn(); if (!error) return; if (t === 2) throw error; await new Promise(r => setTimeout(r, 600 * (t + 1))); } }
$('go').onclick = async () => {
  $('go').disabled = true; const st = $('st'); st.className = 'st';
  try {
    st.textContent = 'Leyendo lo que ya está cargado…';
    const [cx, px] = await Promise.all([all('conjuntos', 'id,codigo'), all('piezas', 'conjunto,id')]);
    const haveC = new Map(cx.map(c => [c.id, c])), haveP = new Set(px.map(p => p.conjunto + '|' + p.id));
    const newC = DATA.conjuntos.filter(c => !haveC.has(c.id)).map(({ notas, ...c }) => ({ ...c, notas: {} }));
    const updC = DATA.conjuntos.filter(c => haveC.has(c.id));
    const newP = DATA.piezas.filter(p => !haveP.has(p.conjunto + '|' + p.id));
    const updP = DATA.piezas.filter(p => haveP.has(p.conjunto + '|' + p.id));
    const total = newC.length + updC.length + newP.length + updP.length; let done = 0;
    const tick = (n = 1) => { done += n; $('fill').style.width = (100 * done / total).toFixed(1) + '%'; st.textContent = `Cargando… ${done} de ${total}`; };
    for (let i = 0; i < newC.length; i += 50) { const b = newC.slice(i, i + 50); await retry(() => sb.from('conjuntos').insert(b)); tick(b.length); }
    await pool(updC, 6, async (c) => { const d = { categoria: c.categoria, marca: c.marca }; if (!haveC.get(c.id).codigo) d.codigo = c.codigo; await retry(() => sb.from('conjuntos').update(d).eq('id', c.id)); tick(); });
    for (let i = 0; i < newP.length; i += 25) { const b = newP.slice(i, i + 25); await retry(() => sb.from('piezas').insert(b)); tick(b.length); }
    await pool(updP, 6, async (p) => { await retry(() => sb.from('piezas').update({ geom: p.geom, bbox: p.bbox, archivo: p.archivo }).eq('conjunto', p.conjunto).eq('id', p.id)); tick(); });
    $('fill').style.width = '100%'; st.className = 'st ok';
    st.innerHTML = `Listo: ${newC.length} conjuntos nuevos, ${newP.length} piezas nuevas y ${updP.length} dibujos actualizados. <a href="./">Abrir el catálogo</a>`;
  } catch (e) {
    console.error(e); st.className = 'st err';
    st.textContent = 'Se cortó la carga: ' + (e.message || e) + '. Tocá "Cargar ahora" de nuevo; sigue desde donde quedó.';
    $('go').disabled = false;
  }
};
