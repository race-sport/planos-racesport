/* Layout: barra de herramientas fija arriba; las hojas A4 apaisadas se apilan como papel sobre la mesa de taller. */
:root {
  --bg: #e7e9ec;
  --surface: #ffffff;
  --ink: #16181b;
  --muted: #5d636b;
  --line: #c9cdd3;
  --accent: #e30016;
  --accent-ink: #ffffff;
  --ok: #1f7a46;
  --chip: #f1f2f4;
  --shadow: 0 1px 2px rgba(22,24,27,.08), 0 6px 24px rgba(22,24,27,.08);
  --f-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --f-body: "Barlow", Arial, Helvetica, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15171a; --surface: #1f2226; --ink: #eceef1; --muted: #9aa1aa; --line: #343941;
  --accent: #ff2b3d; --accent-ink: #ffffff; --ok: #4cc283; --chip: #2a2e34;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15171a; --surface: #1f2226; --ink: #eceef1; --muted: #9aa1aa; --line: #343941;
  --accent: #ff2b3d; --accent-ink: #ffffff; --ok: #4cc283; --chip: #2a2e34;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35); color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; max-width: 1240px; margin: 0 auto }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 260px }
.brand .mark { width: 10px; align-self: stretch; background: var(--accent); border-radius: 1px }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: 1.45rem; letter-spacing: .01em; margin: 0; line-height: 1.05; text-wrap: balance }
.brand .sub { color: var(--muted); font-size: .85rem; margin-top: 2px }
.brand select { font: inherit; font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; background: var(--chip); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; max-width: 100% }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; background: var(--chip); color: var(--muted) }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted) }
.chip.live .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent) }
.chip.live { color: var(--ok) }
.btn { font: inherit; font-weight: 600; font-size: .92rem; border-radius: 6px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px }
.btn:hover { border-color: var(--ink) }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink) }
.btn.red { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted) }
.btn:disabled { opacity: .5; cursor: default }
.btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.hint { max-width: 1240px; margin: 14px auto 0; color: var(--muted); font-size: .9rem; display: flex; flex-wrap: wrap; gap: 6px 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hint b { color: var(--ink); font-weight: 600 }
.notice { max-width: 1240px; margin: 12px auto 0; padding: 10px 14px; border-radius: 6px; background: var(--chip); color: var(--ink); font-size: .9rem }
.notice[hidden] { display: none }

#sheets { max-width: 1240px; margin: 0 auto; padding-block: 16px 60px; display: grid; gap: 22px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet { background: #fff; box-shadow: var(--shadow); border-radius: 2px; overflow: hidden; max-width: 100% }
.sheet svg { display: block; width: 100%; height: auto; aspect-ratio: 297 / 210; touch-action: manipulation }
.sheet-label { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); margin: 0 0 6px; letter-spacing: .04em }
[data-act] { cursor: pointer }
[data-act="draw"] { cursor: crosshair }
.empty { text-align: center; color: var(--muted); padding: 60px 0 }

/* Panel lateral / hoja inferior */
.scrim { position: fixed; inset: 0; background: rgba(10,12,14,.35); z-index: 20 }
.panel { position: fixed; z-index: 21; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); display: flex; flex-direction: column;
  right: 0; top: 0; bottom: 0; width: min(420px, 100%); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px) }

.panel header { display: flex; align-items: flex-start; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line) }
.panel header h2 { font-family: var(--f-display); font-weight: 800; font-size: 1.35rem; margin: 0; line-height: 1.1; flex: 1; min-width: 0; text-wrap: balance }
.panel header .kicker { display: block; font-family: var(--f-body); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 3px }
.panel .body { overflow-y: auto; padding: 16px 18px 22px; display: grid; gap: 18px }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px }
.field { display: grid; gap: 4px; min-width: 0 }
.field.wide { grid-column: 1 / -1 }
.field label { font-size: .75rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.field input, .field textarea { font: inherit; font-size: 1rem; padding: 9px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; min-width: 0 }
.field textarea { min-height: 84px; resize: vertical }
.field input.num { font-family: var(--f-mono) }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.section-title { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; letter-spacing: .02em; margin: 0 0 8px; display: flex; align-items: center; gap: 8px }
.muted { color: var(--muted); font-size: .85rem }
.drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 8px; text-align: center }
.drop.over { border-color: var(--accent) }
.clist { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none }
.citem { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px }
.citem.done { opacity: .7 }
.num-badge { display: inline-grid; place-items: center; min-width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: .9rem; font-variant-numeric: tabular-nums; padding: 0 6px }
.done .num-badge { background: var(--muted) }
.check { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: .9rem }
.check input { width: 18px; height: 18px; accent-color: var(--ok) }
.meta { color: var(--muted); font-size: .8rem }

.quick { position: fixed; z-index: 25; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 8px 10px; display: grid; gap: 4px }
.quick label { font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.quick input { font: inherit; font-family: var(--f-mono); font-size: 1.05rem; padding: 7px 8px; border-radius: 6px; border: 1px solid var(--accent); background: var(--bg); color: var(--ink); width: 100%; min-width: 0 }
.pgroup { display: grid; gap: 6px }
.pgroup-t { font-family: var(--f-display); font-weight: 700; font-size: .95rem; letter-spacing: .04em; text-transform: uppercase; margin: 6px 0 0; color: var(--muted) }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px }
.pitem { width: 100%; text-align: left; font: inherit; display: grid; grid-template-columns: 7.5em 1fr; gap: 10px; align-items: baseline; padding: 9px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer }
.pitem:hover { border-color: var(--ink) }
.pitem.on { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent) }
.pcode { font-family: var(--f-mono); font-size: .85rem; font-weight: 500 }
.pname { min-width: 0; font-weight: 600 }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--surface);
  padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: .92rem; box-shadow: var(--shadow); max-width: calc(100% - 32px) }
@media (prefers-reduced-motion: no-preference) { .toast { animation: up .2s ease-out } @keyframes up { from { transform: translate(-50%, 8px); opacity: 0 } } }
</style>

/* ------------------------------------------------------------ geometría */
function bboxOf(g) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
  (g.L || []).forEach(l => { add(l[0], l[1]); add(l[2], l[3]); });
  (g.C || []).forEach(c => { add(c[0] - c[2], c[1] - c[2]); add(c[0] + c[2], c[1] + c[2]); });
  (g.A || []).forEach(a => {
    const [cx, cy, r, s, e] = a; let en = e; if (en <= s) en += 360;
    add(cx + r * Math.cos(s * Math.PI / 180), cy + r * Math.sin(s * Math.PI / 180));
    add(cx + r * Math.cos(e * Math.PI / 180), cy + r * Math.sin(e * Math.PI / 180));
    for (let k = Math.ceil(s / 90) * 90; k < en; k += 90) add(cx + r * Math.cos(k * Math.PI / 180), cy + r * Math.sin(k * Math.PI / 180));
  });
  return [x0, y0, x1, y1];
}
function partSize(p) { const b = p.bbox; return { W: b[2] - b[0], H: b[3] - b[1] }; }

/* ------------------------------------------------------------ armado de hojas */
function cellSize(p, sc) { const { W, H } = partSize(p); return { w: Math.max(W / sc + 20, 84), h: H / sc + 8 + HB + 12 }; }
function packCols(items) {
  const cols = [];
  for (const it of items) {
    const c = cols[cols.length - 1];
    if (c && c.h + G + it.h <= AH) { c.items.push(it); c.h += G + it.h; c.w = Math.max(c.w, it.w); }
    else { if (it.h > AH) return null; cols.push({ items: [it], w: it.w, h: it.h }); }
  }
  const cam = { camb: true, w: CAMB.w, h: CAMB.h };
  const host = cols.find(c => AH - c.h - G >= cam.h);
  if (host) { host.items.push(cam); host.h += G + cam.h; host.w = Math.max(host.w, cam.w); }
  else cols.push({ items: [cam], w: cam.w, h: cam.h });
  const tot = cols.reduce((a, c) => a + c.w, 0) + G * (cols.length - 1);
  return tot <= AW ? cols : null;
}
function buildLayout(piezas) {
  if (!piezas.length) return { sc: 3, sheets: [] };
  let sc = 3;
  for (const cand of [3, 4, 5, 6, 8, 10, 15, 20, 30]) { sc = cand; if (piezas.every(p => packCols([{ p, ...cellSize(p, cand) }]))) break; }
  const sheets = []; let cur = [];
  for (const p of piezas) {
    const it = { p, ...cellSize(p, sc) };
    if (packCols([...cur, it])) cur.push(it); else { sheets.push(cur); cur = [it]; }
  }
  if (cur.length) sheets.push(cur);
  return { sc, sheets: sheets.map(items => {
    const cols = packCols(items);
    const sumW = cols.reduce((a, c) => a + c.w, 0), extraW = AW - sumW - G * (cols.length - 1);
    let x = AX; const cells = [];
    cols.forEach(c => {
      const cw = c.w + extraW * c.w / sumW;
      const sumH = c.items.reduce((a, i) => a + i.h, 0), extraH = AH - sumH - G * (c.items.length - 1);
      let y = AY;
      c.items.forEach(i => { const ch = i.h + extraH * i.h / sumH; cells.push({ ...i, x, y, w: cw, h: ch }); y += ch + G; });
      x += cw + G;
    });
    return cells;
  }) };
}

    `<g data-act="quick" data-key="${p.id}" data-field="esp" data-label="Espesor">${be}</g>`);
  // dibujo
  const dw = W * k, dh = H * k, ay = y + HB, ah = h - HB;
  const ox = x + (w - (dw + 8)) / 2 + 8, top = ay + (ah - (dh + 8)) / 2 + 8, base = top + dh;
  const P = (px, py) => [ox + (px - p.bbox[0]) * k, base - (py - p.bbox[1]) * k];
  if (!forPdf) o.push(`<rect data-act="draw" data-key="${p.id}" x="${x + 0.5}" y="${ay + 0.5}" width="${w - 1}" height="${ah - 1}" fill="transparent"/>`);
  o.push(`<g pointer-events="none">${geomSvg(p.geom || {}, P, k)}</g>`);
  // cotas generales
  const yl = top - 5, xl = ox - 6;
  const dim = [`<g stroke="${DIM}" stroke-width="0.18">`,
    `<line x1="${ox}" y1="${top - 1}" x2="${ox}" y2="${yl - 1.5}"/><line x1="${ox + dw}" y1="${top - 1}" x2="${ox + dw}" y2="${yl - 1.5}"/>`,
    `<line x1="${ox}" y1="${yl}" x2="${ox + dw}" y2="${yl}"/>`,
    `<line x1="${ox - 1}" y1="${top}" x2="${xl - 1.5}" y2="${top}"/><line x1="${ox - 1}" y1="${base}" x2="${xl - 1.5}" y2="${base}"/>`,
    `<line x1="${xl}" y1="${top}" x2="${xl}" y2="${base}"/></g>`,
    arrow(ox, yl, 180), arrow(ox + dw, yl, 0), arrow(xl, top, -90), arrow(xl, base, 90)];
  const lblA = T(ox + dw / 2, yl - 0.9, p.ancho || fmt(W), 2.8, { a: 'middle', c: DIM });
  const lblH = T(xl - 0.9, top + dh / 2, p.alto || fmt(H), 2.8, { a: 'middle', c: DIM, rot: -90 });
  const multi = !!(p.geom || {}).multi;
  if (multi) o.push(T(x + 3, ay + 4.6, 'Varias piezas en este archivo · sin cotas generales', 2.3, { c: '#777' }));
  else o.push(dim.join(''));
  if (!multi) o.push(forPdf ? lblA + lblH : `<g data-act="quick" data-key="${p.id}" data-field="ancho" data-label="Cota ancho (mm)"><rect x="${ox + dw / 2 - 9}" y="${yl - 4.5}" width="18" height="4.5" fill="transparent"/>${lblA}</g><g data-act="quick" data-key="${p.id}" data-field="alto" data-label="Cota alto (mm)"><rect x="${xl - 4.5}" y="${top + dh / 2 - 9}" width="4.5" height="18" fill="transparent"/>${lblH}</g>`);
  // globitos
  const balls = S.cambios.filter(cb => cb.pieza === p.id);
  if (S.pend && S.pend.pieza === p.id && !forPdf) balls.push({ ...S.pend, n: S.pend.n, pending: true });
  balls.forEach(cb => {
    const [px, py] = P(cb.x, cb.y), bx = px + 4.2, by = py - 4.2, col = cb.aplicado ? '#8a8f96' : RED;
    const g = `<circle cx="${px.toFixed(2)}" cy="${py.toFixed(2)}" r="0.6" fill="${col}"/>
      <line x1="${px.toFixed(2)}" y1="${py.toFixed(2)}" x2="${(bx - 2).toFixed(2)}" y2="${(by + 2).toFixed(2)}" stroke="${col}" stroke-width="0.3"/>
      <circle cx="${bx.toFixed(2)}" cy="${by.toFixed(2)}" r="2.8" fill="${cb.pending ? '#fff' : col}" stroke="${col}" stroke-width="${cb.pending ? 0.5 : 0}"${cb.pending ? ' stroke-dasharray="0.8 0.5"' : ''}/>
      ${T(bx, by + 1.2, cb.n, 3.3, { a: 'middle', c: cb.pending ? col : '#fff', w: 700 })}`;
    o.push(forPdf || cb.pending ? `<g>${g}</g>` : `<g data-act="cambio" data-id="${cb.id}">${g}</g>`);
  });
  o.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${INK}" stroke-width="0.35" pointer-events="none"/>`);
  return o.join('');
}

function cambiosCell(c, keys, forPdf, sheetN) {
  const { x, y, w, h } = c, o = [];
  const NH = Math.max(22, (h - HB) * 0.42), lh = h - NH;
  o.push(`<rect x="${x}" y="${y}" width="${w}" height="${HB}" fill="${GRAY}"/>`);
  o.push(`<line x1="${x}" y1="${y + HB}" x2="${x + w}" y2="${y + HB}" stroke="${INK}" stroke-width="0.25"/>`);
  o.push(T(x + 3, y + 6.6, 'CAMBIOS', 3.5, { w: 700 }));
  o.push(T(x + 3, y + 10.6, forPdf ? 'Marcados con globito sobre el dibujo' : 'Tocá el dibujo para marcar un cambio', 2.2, { c: '#777' }));
  const list = S.cambios.filter(cb => keys.includes(cb.pieza)).sort((a, b) => a.n - b.n);
  const rh = 6.6, cap = Math.max(1, Math.floor((lh - HB - 3) / rh));
  const shown = list.length > cap ? list.slice(0, cap - 1) : list;
  shown.forEach((cb, i) => {
    const ry = y + HB + 1.5 + i * rh, cy = ry + rh / 2, col = cb.aplicado ? '#8a8f96' : RED;
    if (i) o.push(`<line x1="${x + 3}" y1="${ry}" x2="${x + w - 3}" y2="${ry}" stroke="#d5d7da" stroke-width="0.15"/>`);
    const pz = S.piezas.find(p => p.id === cb.pieza);
    const txt = `${pz ? pz.nombre : cb.pieza}: ${cb.texto || '(sin texto)'}${cb.aplicado ? '  (aplicado)' : ''}`;
    const row = `<rect x="${x + 1}" y="${ry}" width="${w - 2}" height="${rh}" fill="transparent"/><circle cx="${x + 5.8}" cy="${cy.toFixed(2)}" r="2.4" fill="${col}"/>${T(x + 5.8, cy + 1.05, cb.n, 2.9, { a: 'middle', c: '#fff', w: 700 })}${T(x + 10, cy + 1, clip(txt, 2.6, w - 13), 2.6, { c: cb.aplicado ? '#8a8f96' : INK })}`;
    o.push(forPdf ? row : `<g data-act="cambio" data-id="${cb.id}">${row}</g>`);
  });
  if (list.length > cap) o.push(T(x + 10, y + HB + 1.5 + (cap - 1) * rh + rh / 2 + 1, `+${list.length - cap + 1} cambios más (ver en la página)`, 2.4, { c: '#777' }));
  if (!list.length) o.push(T(x + w / 2, y + HB + (lh - HB) / 2 + 1, 'Sin cambios marcados', 2.6, { a: 'middle', c: '#9a9ea4' }));
  // notas
  const ny = y + lh, nota = ((S.conj && S.conj.notas) || {})[sheetN] || '';
  const nt = [`<rect x="${x}" y="${ny}" width="${w}" height="${NH}" fill="#fafafa"/>`,
    `<line x1="${x}" y1="${ny}" x2="${x + w}" y2="${ny}" stroke="${INK}" stroke-width="0.25"/>`,
    T(x + 3, ny + 4.4, 'NOTAS', 2.4, { w: 700, ls: 0.3 })];
  const maxCh = Math.floor((w - 6) / (2.6 * 0.5)), lines = [];
  nota.split('\n').forEach(par => { let cur = ''; par.split(' ').forEach(wd => { if ((cur + ' ' + wd).trim().length > maxCh) { lines.push(cur); cur = wd; } else cur = (cur + ' ' + wd).trim(); }); lines.push(cur); });
  const maxL = Math.max(1, Math.floor((NH - 7) / 3.5));
  if (nota) lines.slice(0, maxL).forEach((ln, i) => nt.push(T(x + 3, ny + 8.6 + i * 3.5, i === maxL - 1 && lines.length > maxL ? clip(ln + ' …', 2.6, w - 6) : ln, 2.6)));
  if (!nota && !forPdf) nt.push(T(x + 3, ny + 8.6, 'Tocá acá para escribir notas o comentarios', 2.4, { c: '#9a9ea4' }));
  o.push(forPdf ? nt.join('') : `<g data-act="nota" data-sheet="${sheetN}">${nt.join('')}</g>`);
  o.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${INK}" stroke-width="0.35"/>`);
  return o.join('');
}

function sheetSvg(cells, n, total, sc, forPdf) {
  const keys = cells.filter(c => c.p).map(c => c.p.id);
  const o = [`<rect width="${PW}" height="${PH}" fill="#fff"/>`,
    `<rect x="${M}" y="${M}" width="${PW - 2 * M}" height="${PH - 2 * M}" fill="none" stroke="${INK}" stroke-width="0.5"/>`];
  cells.forEach(c => o.push(c.camb ? cambiosCell(c, keys, forPdf, n) : pieceCell(c, sc, forPdf)));
  const ty = PH - M - TB;
  o.push(`<line x1="${M}" y1="${ty}" x2="${PW - M}" y2="${ty}" stroke="${INK}" stroke-width="0.5"/>`);
  o.push(`<rect x="${M}" y="${ty}" width="2.2" height="${TB}" fill="${RED}"/>`);
  const lw = 42, ls = lw / 1074;
  o.push(`<g transform="translate(${M + 6} ${ty + 4.5}) scale(${ls.toFixed(5)}) translate(-90 -252)">${LOGO}</g>`);
  const xa = M + 55, cj = S.conj || {};
  if (!forPdf) o.push(`<rect data-act="conj" x="${xa}" y="${ty}" width="${PW - M - xa}" height="${TB}" fill="transparent"/>`);
  o.push(`<line x1="${xa}" y1="${ty}" x2="${xa}" y2="${PH - M}" stroke="${INK}" stroke-width="0.3"/>`);
  o.push('<g pointer-events="none">');
  o.push(T(xa + 4, ty + 6.5, 'CONJUNTO', 2, { c: '#777', w: 600, ls: 0.4 }));
  const tit = `${cj.codigo || cj.id || ''} · ${cj.nombre || ''}`;
  o.push(T(xa + 4, ty + 14.5, tit, fitSize(tit, 6, 150, 0.55), { w: 700 }));
  o.push(T(xa + 4, ty + 20, clip('Hoja ' + n + ': ' + cells.filter(c => c.p).map(c => c.p.nombre).join(' · '), 2.6, 150), 2.6, { c: '#555' }));
  const xb = PW - M - 60;
  o.push(`<line x1="${xb}" y1="${ty}" x2="${xb}" y2="${PH - M}" stroke="${INK}" stroke-width="0.3"/>`);
  [['ESCALA', `1:${String(sc).replace('.', ',')} todas las piezas`], ['FECHA', cj.fecha || ''], ['HOJA', `${n} / ${total}`]].forEach(([k, v], i) => {
    const yy = ty + i * TB / 3;
    if (i) o.push(`<line x1="${xb}" y1="${yy}" x2="${PW - M}" y2="${yy}" stroke="${INK}" stroke-width="0.2"/>`);
    o.push(T(xb + 2, yy + 3.2, k, 1.7, { c: '#777', w: 600, ls: 0.3 }));
    o.push(T(xb + 2, yy + 6.9, v, 2.7, { w: 600 }));
  });
  o.push('</g>');
  return `<svg xmlns="${NS}" viewBox="0 0 ${PW} ${PH}" width="${PW}mm" height="${PH}mm">${o.join('')}</svg>`;
}

function render() {
  const root = $('sheets');
  const ps = [...S.piezas].sort((a, b) => (a.orden ?? 99) - (b.orden ?? 99));
  S.layout = buildLayout(ps);
  if (!ps.length) { root.innerHTML = `<div class="empty">${S.conjId ? 'Este conjunto todavía no tiene piezas cargadas.' : 'Todavía no hay conjuntos cargados.'}</div>`; return; }
  const total = S.layout.sheets.length;
  root.innerHTML = S.layout.sheets.map((cells, i) =>
    `<section><p class="sheet-label">HOJA ${i + 1} DE ${total}</p><div class="sheet" data-sheet="${i}">${sheetSvg(cells, i + 1, total, S.layout.sc, false)}</div></section>`).join('');
  $('btnPdf').hidden = false;
}

/* ------------------------------------------------------------ interacción */
$('sheets').addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'edit') return openPieza(t.dataset.key);
  if (act === 'quick') return quickEdit(t, t.dataset.key, t.dataset.field, t.dataset.label);
  if (act === 'nota') return openNota(+t.dataset.sheet);
  if (act === 'conj') return openConj();
  if (act === 'cambio') return openCambio(t.dataset.id);
  if (act === 'draw') {
    if (!S.canWrite) { toast('Solo lectura: no podés marcar cambios'); return; }
    const svg = t.ownerSVGElement, pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const sp = pt.matrixTransform(svg.getScreenCTM().inverse());
    const sheetIdx = +t.closest('.sheet').dataset.sheet;
    const cell = S.layout.sheets[sheetIdx].find(c => c.p && c.p.id === t.dataset.key);
    const p = cell.p, k = 1 / S.layout.sc, { W, H } = partSize(p);
    const dw = W * k, dh = H * k, ay = cell.y + HB, ah = cell.h - HB;
    const ox = cell.x + (cell.w - (dw + 8)) / 2 + 8, top = ay + (ah - (dh + 8)) / 2 + 8, base = top + dh;
    const x = p.bbox[0] + (sp.x - ox) / k, y = p.bbox[1] + (base - sp.y) / k;
    const n = S.cambios.reduce((m, c) => Math.max(m, c.n || 0), 0) + 1;
    S.pend = { pieza: p.id, x: +x.toFixed(2), y: +y.toFixed(2), n };
    render(); openNuevo();
  }
});

function openPanel(kicker, title, html) {
  $('pTitle').innerHTML = `<span class="kicker">${esc(kicker)}</span>${esc(title)}`;
  $('pBody').innerHTML = html; $('panel').hidden = false; $('scrim').hidden = false;
}
function closePanel() {
  $('panel').hidden = true; $('scrim').hidden = true; S.panel = null;
  if (S.pend) { S.pend = null; render(); }
}
$('pClose').onclick = closePanel; $('scrim').onclick = closePanel;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('panel').hidden) closePanel(); });

function who(c) {
  const nm = c.autor || ''; const d = c.creado ? new Date(c.creado) : null;
  return [nm, d ? d.toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : ''].filter(Boolean).join(' · ');
}

function openNuevo() {
  const p = S.piezas.find(q => q.id === S.pend.pieza);
  S.panel = { type: 'nuevo' };
  openPanel(`Nuevo cambio · ${p.nombre}`, `Globito ${S.pend.n}`, `
    <div class="field"><label for="nWho">Tu nombre</label><input id="nWho" value="${esc(myName())}" placeholder="Ej.: Juan (corte)"></div>
    <div class="field"><label for="nTxt">¿Qué hay que cambiar?</label>
      <textarea id="nTxt" placeholder="Ej.: agujero de Ø10 pasar a Ø12"></textarea></div>
    <div class="row"><button class="btn red" id="nSave" type="button">Guardar cambio</button><button class="btn" id="nCancel" type="button">Cancelar</button></div>
    <p class="muted">El globito queda donde tocaste el dibujo. Lo ven todos los que tienen la página abierta.</p>`);
  setTimeout(() => (myName() ? $('nTxt') : $('nWho')).focus(), 50);
  $('nCancel').onclick = closePanel;
  $('nSave').onclick = async () => {
    const texto = $('nTxt').value.trim(); if (!texto) { $('nTxt').focus(); return; }
    $('nSave').disabled = true;
    try {
      const autor = $('nWho').value.trim(); setName(autor);
      await api.addCambio({ ...S.pend, conjunto: S.conjId, texto, aplicado: false, autor });
      S.pend = null; closePanel(); toast('Cambio guardado');
    } catch (e) { $('nSave').disabled = false; writeFail(e); }
  };
}

function cambioItem(c) {
  return `<li class="citem${c.aplicado ? ' done' : ''}" data-cid="${c.id}">
    <div class="row"><span class="num-badge">${c.n}</span><span class="meta">${esc(who(c))}</span></div>
    <div class="field"><label for="ct-${c.id}">Descripción</label><textarea id="ct-${c.id}" ${S.canWrite ? '' : 'readonly'}>${esc(c.texto)}</textarea></div>
    <div class="row">
      <label class="check"><input type="checkbox" id="ca-${c.id}" ${c.aplicado ? 'checked' : ''} ${S.canWrite ? '' : 'disabled'}> Aplicado</label>
      ${S.canWrite ? `<button class="btn" type="button" data-save="${c.id}">Guardar</button><button class="btn ghost" type="button" data-del="${c.id}">Eliminar</button>` : ''}
    </div></li>`;
}
function bindCambioItems(root) {
  root.querySelectorAll('[data-save]').forEach(b => b.onclick = async () => {
    const id = b.dataset.save; b.disabled = true;
    try { await api.updCambio(id, { texto: $('ct-' + id).value.trim() }); toast('Cambio actualizado'); }
    catch (e) { writeFail(e); } b.disabled = false;
  });
  root.querySelectorAll('input[type=checkbox][id^="ca-"]').forEach(ch => ch.onchange = async () => {
    const id = ch.id.slice(3);
    try { await api.updCambio(id, { aplicado: ch.checked }); } catch (e) { writeFail(e); }
  });
  root.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = '¿Eliminar? Tocá de nuevo'; b.classList.add('red'); return; }
    try { await api.delCambio(b.dataset.del); toast('Cambio eliminado'); } catch (e) { writeFail(e); }
  });
}
function openCambio(id) {
  const c = S.cambios.find(x => x.id === id); if (!c) return;
  const p = S.piezas.find(q => q.id === c.pieza);
  S.panel = { type: 'cambio', id };
  openPanel(p ? p.nombre : 'Cambio', `Cambio ${c.n}`, `<ul class="clist">${cambioItem(c)}</ul>
    <button class="btn" type="button" id="goPieza">Ver pieza completa</button>`);
  bindCambioItems($('pBody'));
  $('goPieza').onclick = () => openPieza(c.pieza);
}

function openPieza(key) {
  const p = S.piezas.find(q => q.id === key); if (!p) return;
  S.panel = { type: 'pieza', key };
  const ro = S.canWrite ? '' : 'readonly';
  const list = S.cambios.filter(c => c.pieza === key).sort((a, b) => a.n - b.n);
  openPanel(p.codigo || 'Pieza', p.nombre, `
    <section><h3 class="section-title">Datos de la pieza</h3>
      <div class="grid2">
        <div class="field wide"><label for="fNombre">Nombre</label><input id="fNombre" value="${esc(p.nombre)}" ${ro}></div>

        <div class="field"><label for="fAncho">Cota ancho (mm)</label><input id="fAncho" class="num" value="${esc(p.ancho)}" ${ro}></div>

      </div>

    </section>
    ${S.canWrite ? `<section><h3 class="section-title">Dibujo</h3>
      <div class="drop" id="drop">
        <div><b>Reemplazar con un DWG o DXF corregido</b></div>
        <div class="muted">Archivo actual: ${esc(p.archivo || '—')}</div>

        <input type="file" id="fFile" accept=".dwg,.dxf" hidden>

      </div></section>` : ''}
    <section><h3 class="section-title">Cambios marcados <span class="muted">(${list.length})</span></h3>
      ${list.length ? `<ul class="clist">${list.map(cambioItem).join('')}</ul>` : '<p class="muted">Sin cambios en esta pieza. Tocá el dibujo para marcar uno.</p>'}
    </section>`);
  bindCambioItems($('pBody'));

  $('fSave').onclick = async () => {
    const b = $('fSave'); b.disabled = true;

  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) replaceDrawing(key, f); });
}

/* ------------------------------------------------------------ edición rápida en el lugar */
function quickEdit(el, key, field, label) {
  const p = S.piezas.find(q => q.id === key); if (!p) return;
  document.querySelectorAll('.quick').forEach(n => n.remove());
  const r = el.getBoundingClientRect();
  const box = document.createElement('div'); box.className = 'quick';
  const w = Math.max(160, r.width + 40);
  box.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, r.left + r.width / 2 - w / 2)) + 'px';
  box.style.top = Math.max(8, r.top - 64) + 'px'; box.style.width = w + 'px';
  box.innerHTML = `<label for="qIn">${esc(label)}</label><input id="qIn" value="${esc(p[field] || '')}" autocomplete="off">`;
  document.body.appendChild(box);
  const inp = box.querySelector('input'); inp.focus(); inp.select();
  let done = false;
  const finish = async (save) => {
    if (done) return; done = true; box.remove();
    const v = inp.value.trim();
    if (save && v !== (p[field] || '')) { try { await api.updPieza(key, { [field]: v, editado_por: myName() }); toast(`${label}: ${v}`); } catch (e) { writeFail(e); } }
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); });
  inp.addEventListener('blur', () => finish(true));
}
function openConj() {
  const c = S.conj || {};
  S.panel = { type: 'conj' };
  openPanel('Rótulo de las hojas', 'Datos del conjunto', `
    <div class="grid2">
      <div class="field"><label for="kCod">Código</label><input id="kCod" class="num" value="${esc(c.codigo || c.id || '')}"></div>
      <div class="field"><label for="kFecha">Fecha</label><input id="kFecha" class="num" value="${esc(c.fecha || '')}"></div>
      <div class="field wide"><label for="kNom">Nombre</label><input id="kNom" value="${esc(c.nombre || '')}"></div>
    </div>
    <div class="row"><button class="btn primary" id="kSave" type="button">Guardar</button></div>`);
  $('kSave').onclick = async () => {
    const b = $('kSave'); b.disabled = true;

    catch (e) { writeFail(e); b.disabled = false; }

}
function openNota(n) {

/* ------------------------------------------------------------ lectura DWG / DXF */
let dwgLib = null;
async function loadDwg() {
  if (dwgLib) return dwgLib;
  const [glue, mod, bin] = await Promise.all([
    import(CDN + 'wasm/libredwg-web.js'), import(CDN + 'dist/libredwg-web.js'),
    fetch('libredwg-web.wasm').then(r => { if (!r.ok) throw new Error('wasm'); return r.arrayBuffer(); })]);
  const inst = await glue.default({ wasmBinary: bin });
  dwgLib = { lib: mod.LibreDwg.createByWasmInstance(inst), T: mod.Dwg_File_Type };
  return dwgLib;
}
function addBulgeSeg(g, a, b, bulge) {
  if (!bulge) { g.L.push([a.x, a.y, b.x, b.y]); return; }
  const th = 4 * Math.atan(bulge), dx = b.x - a.x, dy = b.y - a.y, ch = Math.hypot(dx, dy);
  const r = Math.abs(ch / (2 * Math.sin(th / 2))), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const d = Math.sqrt(Math.max(0, r * r - ch * ch / 4)), sgn = (bulge > 0 ? 1 : -1) * (Math.abs(th) > Math.PI ? -1 : 1);
  const cx = mx - sgn * d * dy / ch, cy = my + sgn * d * dx / ch;
  let s = Math.atan2(a.y - cy, a.x - cx) * 180 / Math.PI, e = Math.atan2(b.y - cy, b.x - cx) * 180 / Math.PI;
  if (bulge < 0) [s, e] = [e, s];
  g.A.push([cx, cy, r, (s + 360) % 360, (e + 360) % 360]);
}
function fromEntities(list) {
  const g = { L: [], A: [], C: [] }; let skip = 0;
  for (const e of list) {
    const flip = e.extrusionDirection && e.extrusionDirection.z < 0;
    const X = (v) => flip ? -v : v;
    if (e.type === 'LINE') g.L.push([X(e.startPoint.x), e.startPoint.y, X(e.endPoint.x), e.endPoint.y]);
    else if (e.type === 'CIRCLE') g.C.push([X(e.center.x), e.center.y, e.radius]);
    else if (e.type === 'ARC') {
      let s = e.startAngle * 180 / Math.PI, en = e.endAngle * 180 / Math.PI;
      if (flip) [s, en] = [180 - en, 180 - s];
      g.A.push([X(e.center.x), e.center.y, e.radius, (s % 360 + 360) % 360, (en % 360 + 360) % 360]);
    } else if (e.type === 'LWPOLYLINE' && e.vertices && e.vertices.length > 1) {
      const v = e.vertices.map(p => ({ x: X(p.x), y: p.y, bulge: flip ? -(p.bulge || 0) : (p.bulge || 0) })), closed = (e.flag & 1) || e.closed;
      for (let i = 0; i < v.length - 1 + (closed ? 1 : 0); i++) addBulgeSeg(g, v[i], v[(i + 1) % v.length], v[i].bulge);
    } else if (!['TEXT', 'MTEXT', 'DIMENSION', 'POINT', 'HATCH'].includes(e.type)) skip++;
  }
  return { g, skip };
}
function parseDxf(txt) {
  const lines = txt.split(/\r?\n/); const tags = [];
  for (let i = 0; i + 1 < lines.length; i += 2) tags.push([parseInt(lines[i].trim(), 10), lines[i + 1].trim()]);
  let i = tags.findIndex((t, j) => t[0] === 2 && t[1] === 'ENTITIES' && tags[j - 1] && tags[j - 1][1] === 'SECTION');
  if (i < 0) throw new Error('El DXF no tiene sección ENTITIES');
  const ents = []; let cur = null;
  for (i++; i < tags.length; i++) {
    const [c, v] = tags[i];
    if (c === 0) { if (v === 'ENDSEC') break; cur = { type: v, t: {}, verts: [] }; ents.push(cur); continue; }
    if (!cur) continue;
    if (cur.type === 'LWPOLYLINE' && c === 10) cur.verts.push({ x: +v, y: 0, bulge: 0 });
    else if (cur.type === 'LWPOLYLINE' && c === 20) cur.verts[cur.verts.length - 1].y = +v;
    else if (cur.type === 'LWPOLYLINE' && c === 42) cur.verts[cur.verts.length - 1].bulge = +v;
    else if (!(c in cur.t)) cur.t[c] = v;
  }
  return ents.map(e => {
    const t = e.t, n = (k) => +(t[k] || 0), ex = { z: t[230] !== undefined ? n(230) : 1 };
    if (e.type === 'LINE') return { type: 'LINE', startPoint: { x: n(10), y: n(20) }, endPoint: { x: n(11), y: n(21) }, extrusionDirection: ex };
    if (e.type === 'CIRCLE') return { type: 'CIRCLE', center: { x: n(10), y: n(20) }, radius: n(40), extrusionDirection: ex };
    if (e.type === 'ARC') return { type: 'ARC', center: { x: n(10), y: n(20) }, radius: n(40), startAngle: n(50) * Math.PI / 180, endAngle: n(51) * Math.PI / 180, extrusionDirection: ex };
    if (e.type === 'LWPOLYLINE') return { type: 'LWPOLYLINE', vertices: e.verts, flag: n(70), extrusionDirection: ex };
    return { type: e.type };
  });
}
async function replaceDrawing(key, file) {
  const st = $('fStatus'); const say = (m) => { if (st) st.textContent = m; };
  try {
    let ents;
    if (/\.dxf$/i.test(file.name)) { say('Leyendo DXF…'); ents = parseDxf(await file.text()); }
    else {
      say('Cargando lector de DWG (la primera vez tarda unos segundos)…');
      const { lib, T: FT } = await loadDwg();
      say('Leyendo DWG…');
      const dwg = lib.dwg_read_data(await file.arrayBuffer(), FT.DWG);
      const db = lib.convert(dwg); try { lib.dwg_free(dwg); } catch (e) {}
      ents = db.entities || [];
    }
    const { g, skip } = fromEntities(ents);
    const n = g.L.length + g.A.length + g.C.length;
    if (!n) throw new Error('No encontré líneas, arcos ni círculos en el archivo.');
    const r4 = (v) => Math.round(v * 1e4) / 1e4;
    const geom = { L: g.L.map(a => a.map(r4)), A: g.A.map(a => a.map(r4)), C: g.C.map(a => a.map(r4)) };
    const bb = bboxOf(geom).map(r4);
    say('Guardando…');
    await api.updPieza(key, { geom, bbox: bb, ancho: fmt(bb[2] - bb[0]), alto: fmt(bb[3] - bb[1]), archivo: file.name, editado_por: myName() });
    say(`Listo: ${n} elementos${skip ? `, ${skip} ignorados (textos, bloques u otros)` : ''}. Medidas: ${fmt(bb[2] - bb[0])} × ${fmt(bb[3] - bb[1])} mm.`);
    toast('Dibujo reemplazado');
  } catch (e) {
    console.error(e);
    const msg = (e && e.code) ? 'No se pudo guardar el dibujo.' :
      /\.dxf$/i.test(file.name) ? `No pude leer el DXF: ${e.message || e}` :
      'No pude leer este DWG en el navegador. Exportalo como DXF desde AutoCAD o el programa del láser y subilo de nuevo.';
    say(msg);
  }
}

/* ------------------------------------------------------------ PDF */
function loadScript(src) { return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error(src)); document.head.appendChild(s); }); }
$('btnPdf').onclick = async () => {
  const b = $('btnPdf'); b.disabled = true; b.textContent = 'Generando…';
  try {
    if (!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    if (!window.svg2pdf) await loadScript('https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.3/dist/svg2pdf.umd.min.js');
    const doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const host = document.createElement('div'); host.style.cssText = 'position:fixed;left:-10000px;top:0;width:1123px';
    document.body.appendChild(host);
    const total = S.layout.sheets.length;
    for (let i = 0; i < total; i++) {
      if (i) doc.addPage('a4', 'landscape');
      host.innerHTML = sheetSvg(S.layout.sheets[i], i + 1, total, S.layout.sc, true);
      await doc.svg(host.firstElementChild, { x: 0, y: 0, width: PW, height: PH });
    }
    host.remove();
    const cj = S.conj || {};
    doc.save(`${cj.id || cj.codigo || 'planos'} ${cj.nombre || ''}.pdf`.replace(/\s+/g, ' ').trim());
    toast('PDF listo');
  } catch (e) {
    console.error(e); toast('No se pudo generar el PDF');
  }
  b.disabled = false; b.textContent = 'Exportar PDF';
};

/* ------------------------------------------------------------ datos (Supabase) */
let sb = null;
function myName() { try { return localStorage.getItem('rs_nombre') || ''; } catch (e) { return ''; } }
function setName(n) { try { if (n) localStorage.setItem('rs_nombre', n); } catch (e) {} }
const ok = ({ error }) => { if (error) throw error; };
const api = {
  async addCambio(c) { const n = S.cambios.reduce((m, x) => Math.max(m, x.n || 0), 0) + 1;
    ok(await sb.from('cambios').insert({ conjunto: c.conjunto, pieza: c.pieza, n, x: c.x, y: c.y, texto: c.texto, aplicado: false, autor: c.autor })); await loadCambios(); },
  async updCambio(id, d) { ok(await sb.from('cambios').update(d).eq('id', id)); await loadCambios(); },
  async delCambio(id) { ok(await sb.from('cambios').delete().eq('id', id)); await loadCambios(); },
  async updConj(d) { ok(await sb.from('conjuntos').update(d).eq('id', S.conjId)); await loadConjs(); },
  async updPieza(key, d) { ok(await sb.from('piezas').update(d).eq('conjunto', S.conjId).eq('id', key)); await loadPiezas(); },
};
function writeFail(e) { console.error(e); toast(navigator.onLine ? 'No se pudo guardar. Probá de nuevo.' : 'Sin internet: no se guardó.'); }
function setReadOnly() { $('notice').hidden = true; }
function setLive(on, txt) { $('live').classList.toggle('live', on); $('liveText').textContent = txt; }
function refreshPanel() {
  if (!S.panel) return;
  if (S.panel.type === 'cambio') { if (S.cambios.some(c => c.id === S.panel.id)) openCambio(S.panel.id); else closePanel(); }
}
async function loadPiezas() {
  const { data, error } = await sb.from('piezas').select('*').eq('conjunto', S.conjId);
  if (error) { setLive(false, 'Sin conexión'); return; }
  S.piezas = data; render();
}
async function loadCambios() {
  const { data, error } = await sb.from('cambios').select('*').eq('conjunto', S.conjId).order('n');
  if (error) return;
  const known = new Set(S.cambios.map(c => c.id));
  if (!S.firstCambios) data.forEach(c => { if (!known.has(c.id) && c.autor !== myName()) {
    const p = S.piezas.find(x => x.id === c.pieza); toast(`Nuevo cambio ${c.n}${p ? ' en ' + p.nombre : ''}${c.autor ? ' · ' + c.autor : ''}`); } });
  S.firstCambios = false; S.cambios = data; render(); refreshPanel();
}
let chan = null;
async function subscribeConj(id) {
  S.conjId = id; S.conj = S.conjs.find(c => c.id === id) || { id }; S.piezas = []; S.cambios = []; S.firstCambios = true;
  $('title').textContent = `${S.conj.codigo || id} · ${S.conj.nombre || ''}`;
  $('subtitle').textContent = ['Race Sport', S.conj.categoria, S.conj.marca].filter(Boolean).join(' · ');
  if (chan) { sb.removeChannel(chan); chan = null; }
  await loadPiezas(); await loadCambios();
  let tP, tC;
  chan = sb.channel('conj-' + id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'piezas', filter: 'conjunto=eq.' + id }, () => { clearTimeout(tP); tP = setTimeout(loadPiezas, 250); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'cambios', filter: 'conjunto=eq.' + id }, () => { clearTimeout(tC); tC = setTimeout(loadCambios, 250); })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'cambios' }, () => { clearTimeout(tC); tC = setTimeout(loadCambios, 250); })
    .subscribe(st => setLive(st === 'SUBSCRIBED', st === 'SUBSCRIBED' ? 'En vivo' : 'Reconectando…'));
}
async function loadConjs() {
  const { data, error } = await sb.from('conjuntos').select('*').order('id');
  if (error) { $('sheets').innerHTML = '<div class="empty">No pude conectar con la base de datos. Revisá la conexión a internet.</div>'; setLive(false, 'Sin conexión'); return; }
  S.conjs = data;
  $('btnConj').hidden = data.length < 2;
  let want = decodeURIComponent((location.hash || '').slice(1)) || S.conjId;
  try { want = want || localStorage.getItem('conj'); } catch (e) {}
  if (!data.some(c => c.id === want)) want = data[0] && data[0].id;
  if (!want) { $('sheets').innerHTML = '<div class="empty">Todavía no hay conjuntos cargados.</div>'; return; }
  if (want !== S.conjId) await subscribeConj(want);
  else { S.conj = data.find(c => c.id === want) || S.conj; $('title').textContent = `${S.conj.codigo || want} · ${S.conj.nombre || ''}`; render(); }
}
function goConj(id) { try { localStorage.setItem('conj', id); } catch (er) {} if (location.hash.slice(1) !== id) location.hash = id; if (id !== S.conjId) subscribeConj(id); window.scrollTo(0, 0); }
window.addEventListener('hashchange', () => { const h = decodeURIComponent(location.hash.slice(1)); if (h && h !== S.conjId && S.conjs.some(c => c.id === h)) subscribeConj(h); });
const norm = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
function pickerList(q) {
  const words = norm(q).split(/\s+/).filter(Boolean);
  const hit = S.conjs.filter(c => { const hay = norm([c.codigo, c.id, c.nombre, c.marca, c.categoria].join(' ')); return words.every(w => hay.includes(w)); });
  if (!hit.length) return '<p class="muted">No hay enganches que coincidan.</p>';
  const groups = new Map();
  hit.sort((a, b) => (a.categoria || '').localeCompare(b.categoria || '') || (a.marca || '').localeCompare(b.marca || '') || (a.codigo || a.id).localeCompare(b.codigo || b.id))
    .forEach(c => { const g = [c.categoria, c.marca].filter(Boolean).join(' · ') || 'Otros'; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(c); });
  return [...groups].map(([g, list]) => `<section class="pgroup"><h3 class="pgroup-t">${esc(g)} <span class="muted">${list.length}</span></h3>
    <ul class="plist">${list.map(c => `<li><button type="button" class="pitem${c.id === S.conjId ? ' on' : ''}" data-cid="${esc(c.id)}"><span class="pcode">${esc(c.codigo || c.id)}</span><span class="pname">${esc((c.nombre || '').replace(/^ENGANCHE\s+/i, ''))}</span></button></li>`).join('')}</ul></section>`).join('');
}
function openPicker() {
  S.panel = { type: 'picker' };
  openPanel(`${S.conjs.length} conjuntos`, 'Buscar enganche', `
    <div class="field"><label for="pq">Código, vehículo o marca</label><input id="pq" type="search" placeholder="Ej.: ranger, EGM061, hilux" autocomplete="off"></div>
    <div id="plist">${pickerList('')}</div>`);
  const inp = $('pq'); setTimeout(() => inp.focus(), 50);
  inp.oninput = () => { $('plist').innerHTML = pickerList(inp.value); };
  $('plist').onclick = (e) => { const b = e.target.closest('[data-cid]'); if (b) { closePanel(); goConj(b.dataset.cid); } };
}
$('btnConj').onclick = openPicker;

(async function start() {
  if (!window.supabase || CONFIG.SUPABASE_URL.startsWith('PEGAR') || CONFIG.SUPABASE_ANON_KEY.startsWith('PEGAR')) { $('empty').textContent = 'Falta configurar la conexión a Supabase (CONFIG al principio del script).'; return; }
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  S.canWrite = true; setReadOnly();
  await loadConjs();
  sb.channel('conjuntos').on('postgres_changes', { event: '*', schema: 'public', table: 'conjuntos' }, loadConjs).subscribe();
})();
</script>
