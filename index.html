/* Layout: el catálogo es un documento continuo de hojas A4 apaisadas (portada, índice, planos) que se recorre con la ruedita; una barra fina arriba busca, ubica y exporta. */
:root {
  --bg: #e9ebee;
  --paper: #ffffff;
  --ink: #16181b;
  --muted: #646a72;
  --line: #d6d9de;
  --accent: #e30016;
  --ok: #1f7a46;
  --shadow: 0 1px 2px rgba(22,24,27,.06), 0 6px 22px rgba(22,24,27,.08);
  --f-body: "Barlow", Arial, Helvetica, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121417; --paper: #1d2024; --ink: #eceef1; --muted: #9aa1aa; --line: #32373e; --accent: #ff2b3d; --ok: #4cc283;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 26px rgba(0,0,0,.35); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121417; --paper: #1d2024; --ink: #eceef1; --muted: #9aa1aa; --line: #32373e; --accent: #ff2b3d; --ok: #4cc283;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 26px rgba(0,0,0,.35); color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0 }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; -webkit-tap-highlight-color: transparent }
button { font: inherit; color: inherit }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper) }

/* barra superior */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; background: var(--paper); border-bottom: 1px solid var(--line) }
.bar-in { max-width: 1240px; margin: 0 auto; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px }
.mark { width: 6px; height: 28px; background: var(--accent) }
.brand { font-weight: 700; letter-spacing: .04em; font-size: .95rem; white-space: nowrap }
.search { position: relative; flex: 1 1 260px; min-width: 0 }
.search input { width: 100%; font: inherit; font-size: 1rem; padding: 9px 12px 9px 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink) }
.search input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted) }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.16); max-height: min(60vh, 460px); overflow-y: auto; padding: 6px; z-index: 9 }
.res { display: grid; grid-template-columns: 7.5em 1fr auto; gap: 10px; align-items: baseline; width: 100%; text-align: left; border: 0; background: none; padding: 8px 8px; border-radius: 6px; cursor: pointer }
.res:hover, .res.sel { background: var(--bg) }
.res .c { font-family: var(--f-mono); font-weight: 600; color: var(--accent); font-size: .88rem }
.res .n { min-width: 0; font-size: .86rem; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.res .pg { font-weight: 700; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums }
.res .sub { grid-column: 2 / 4; font-size: .78rem; color: var(--muted); margin-top: -4px }
.noresults { padding: 14px; color: var(--muted); font-size: .9rem }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.tb { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 12px; font-weight: 600; cursor: pointer; white-space: nowrap }
.tb:hover { border-color: var(--ink) }
.tb.pri { background: var(--ink); color: var(--paper); border-color: var(--ink) }
.tb:disabled { opacity: .5; cursor: default }
.pg-now { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted) }
.live.on { color: var(--ok) } .live.on i { background: var(--ok) }
button:focus-visible, .res:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* zoom */
.zoom { display: inline-flex } .zoom .tb { border-radius: 0; margin-left: -1px; padding: 8px 10px; min-width: 38px } .zoom .tb:first-child { border-radius: 8px 0 0 8px; margin: 0 } .zoom .tb:last-child { border-radius: 0 8px 8px 0 }
.zoom .zv { font-family: var(--f-mono); font-size: .8rem; min-width: 56px }
.docwrap { overflow-x: auto }
/* documento */
.doc { max-width: 1240px; margin: 0 auto; padding-block: 18px 80px; display: grid; gap: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.page { background: #fff; box-shadow: var(--shadow); aspect-ratio: 297 / 210; width: 100%; position: relative; scroll-margin-top: 70px }
.page svg { display: block; width: 100%; height: 100%; touch-action: manipulation; user-select: none; -webkit-user-select: none }
.page [data-act] { cursor: pointer }
.page [data-act="draw"] { cursor: crosshair }
.page .hit { fill: transparent; transition: fill .12s }
.page [data-act]:hover > .hit, .page [data-act].on > .hit { fill: rgba(227, 0, 22, .07) }
.page [data-act="upload"]:hover .upl, .page [data-act="addpiece"]:hover .upl { fill: #fdecee }
/* novedades */
.tb.nov { position: relative } .tb.nov.has { color: var(--accent); border-color: var(--accent) }
.tb.nov b { position: absolute; top: -7px; right: -7px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 99px; background: var(--accent); color: #fff; font-size: .72rem; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--paper) }
.tb.nov.ring svg { animation: ring .8s ease 2 } @keyframes ring { 0%,100% { transform: rotate(0) } 25% { transform: rotate(14deg) } 75% { transform: rotate(-14deg) } }
@media (prefers-reduced-motion: reduce) { .tb.nov.ring svg { animation: none } }
.novlist { display: grid; gap: 2px; max-height: min(60vh, 460px); overflow: auto; margin: 0 -4px }
.novday { font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 8px 6px 2px }
.novrow { display: grid; grid-template-columns: 8px 1fr auto; gap: 8px; align-items: start; text-align: left; border: 0; background: none; color: inherit; font: inherit; padding: 8px 6px; border-radius: 7px; cursor: pointer; width: 100% }
.novrow:hover { background: var(--bg) } .novrow i { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: transparent } .novrow.new i { background: var(--accent) }
.novrow .t { font-size: .92rem; line-height: 1.3 } .novrow .t b { font-family: var(--f-mono, monospace); color: var(--accent); font-size: .85rem; margin-right: 4px }
.novrow small { display: block; color: var(--muted); font-size: .76rem; margin-top: 2px } .novrow .h { font-size: .74rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; margin-top: 2px }
.novrow.mine { opacity: .62 }
.novfoot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 10px; font-size: .8rem; color: var(--muted) }
.novfoot button { font: inherit; font-size: .8rem; font-weight: 700; border: 0; background: none; color: var(--accent); cursor: pointer; padding: 4px 0 }
.novcard { position: fixed; right: 16px; bottom: 16px; z-index: 60; width: min(360px, calc(100vw - 32px)); background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.22); padding: 12px 12px 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; animation: novin .25s ease }
@keyframes novin { from { transform: translateY(12px); opacity: 0 } }
.novcard .k { grid-column: 1 / -1; font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent) }
.novcard .t { font-size: .95rem; line-height: 1.3 } .novcard .t b { font-family: var(--f-mono, monospace) }
.novcard .a { display: flex; gap: 6px; align-items: start } .novcard button { font: inherit; font-weight: 700; font-size: .85rem; border-radius: 7px; border: 0; padding: 7px 11px; cursor: pointer; background: var(--ink); color: var(--paper) } .novcard button.x { background: none; color: var(--muted); padding: 7px 6px }
.page.flashnov { outline: 3px solid var(--accent); outline-offset: 4px; transition: outline-color 1.2s }
/* modo editor */
.laybar { position: absolute; bottom: calc(100% + 6px); right: 0; display: flex; gap: 4px; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 4px 6px; box-shadow: 0 4px 18px rgba(0,0,0,.12); z-index: 2 }
.laybar span { font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 0 4px }
.laybar .lb { border: 1.5px solid transparent; background: none; border-radius: 7px; padding: 2px; cursor: pointer; line-height: 0 }
.laybar .lb.auto { line-height: 1; font-size: .78rem; font-weight: 700; padding: 6px 8px; color: var(--muted) }
.laybar .lb:hover { border-color: var(--line) } .laybar .lb.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent) } .laybar .lb.auto.on { color: var(--accent) }
.laybar .lb:disabled { opacity: .3; cursor: not-allowed }
.laybar .tb-p { fill: #e8ecf3; stroke: #1f4fa3; stroke-width: .8 } .laybar .on .tb-p { fill: #fde5e8; stroke: #e30016 } .laybar .tb-c { fill: #f2f2f2; stroke: #aab; stroke-width: .6; stroke-dasharray: 1.5 1 }
.page .mv { cursor: grab; touch-action: none } .page .gsz { cursor: nwse-resize; touch-action: none } .page .gsz:hover path:first-of-type { fill: #e30016 } .page .autob { cursor: pointer } .page .autob:hover rect { fill: #e8eef9 }
body.gdrag, body.gdrag * { cursor: grabbing !important; user-select: none } body.gsdrag, body.gsdrag * { cursor: nwse-resize !important; user-select: none } .page .mv:hover rect { fill: #e8eef9 }
.page .droptarget { fill: rgba(31,79,163,.10) !important; stroke: #1f4fa3; stroke-width: .6; stroke-dasharray: 2 1.2 }
.ghost { position: fixed; z-index: 50; pointer-events: none; background: #1f4fa3; color: #fff; font-weight: 700; font-size: .85rem; padding: 6px 10px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.25); transform: translate(12px, 12px) }
.page .div .dz { fill: transparent } .page .div line { stroke: #1f4fa3; stroke-width: 0.35; stroke-dasharray: 1.2 1 } .page .div .grip { fill: #1f4fa3 }
.page .div.v { cursor: col-resize } .page .div.h { cursor: row-resize } .page .div { touch-action: none }
.page .div:hover .dz, .page .div.act .dz { fill: rgba(31,79,163,.14) } .page .div:hover line, .page .div.act line { stroke-dasharray: none; stroke-width: 0.5 }
.tb.ic { display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px }
.tb.ic svg { display: block } #undoN { font-size: .8rem; font-variant-numeric: tabular-nums } #undoN:empty { display: none }
.files { display: grid; gap: 4px; max-height: 160px; overflow-y: auto; font-size: .85rem }

.pick { border: 1.5px dashed var(--line); border-radius: 8px; padding: 14px; text-align: center; cursor: pointer; font-weight: 600 } .pick:hover, .pick.over { border-color: var(--accent); color: var(--accent) }
.pop select { font: inherit; font-size: 1rem; color: var(--ink); padding: 9px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); width: 100% }
.bin { display: grid; gap: 6px; max-height: min(55vh, 420px); overflow-y: auto; margin: 0 -4px; padding: 0 4px }
.binrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line) }
.binrow b { font-family: var(--f-mono); color: var(--accent); font-size: .85rem } .binrow .nm { font-weight: 600 } .binrow small { display: block; color: var(--muted); font-size: .76rem }
@media (max-width: 640px) { .tb .lbl { display: none } }
.tb.ed[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff }
.edbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--ink); color: var(--paper);
  border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.25); padding: 10px 12px 10px 16px; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 24px); font-size: .88rem }
.edbar b { color: #ff6b78 } .edbar .tb { background: transparent; color: inherit; border-color: rgba(255,255,255,.3); padding: 6px 10px }
.edbar .tb:hover { border-color: #fff } .edbar .tb:disabled { opacity: .35 }
.page .comp { cursor: grab } .page .comp:hover > g:first-child { stroke: #e30016 }
.page .comp.dragging { cursor: grabbing } .page .comp.dragging > g:first-child { stroke: #e30016 }
.page .rs { cursor: nwse-resize } .page .rs:hover path { fill: #e30016 }
.page .xdel:hover circle { fill: #e30016 } .page .xdel:hover path { stroke: #fff }
body.editing .page [data-act="draw"] { cursor: default }
.page .comp, .page .rs { touch-action: none }
.page.flash { outline: 3px solid var(--accent); outline-offset: 3px; transition: outline-color 1.2s }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: #9a9ea4; font-size: .9rem }

/* cuadrito de edición sobre la hoja */
.pop { position: absolute; z-index: 30; width: min(320px, calc(100vw - 16px)); background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.18); padding: 12px; display: grid; gap: 10px }
.pop.wide { width: min(420px, calc(100vw - 16px)) }
.pop .ph { display: flex; align-items: center; gap: 8px; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.pop .ph .num { display: inline-grid; place-items: center; min-width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; font-size: .8rem; letter-spacing: 0 }
.pop label { display: grid; gap: 4px; font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.pop input, .pop textarea { font: inherit; font-size: 1rem; text-transform: none; letter-spacing: normal; color: var(--ink); padding: 9px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); width: 100%; min-width: 0 }
.pop input:focus, .pop textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent }
.pop textarea { min-height: 84px; resize: vertical }
.pop .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.pop .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.pop .sp { flex: 1 }
.pop .meta { font-size: .78rem; color: var(--muted) }
.pbtn { border: 1px solid var(--line); background: var(--paper); border-radius: 7px; padding: 8px 12px; font-weight: 600; cursor: pointer }
.pbtn.pri { background: var(--ink); color: var(--paper); border-color: var(--ink) }
.pbtn.red { background: var(--accent); color: #fff; border-color: var(--accent) }
.pbtn.ghost { border-color: transparent; background: transparent; color: var(--muted) }
.pbtn:disabled { opacity: .5 }
.check { display: inline-flex; gap: 7px; align-items: center; font-weight: 600; font-size: .9rem; text-transform: none; letter-spacing: 0; color: var(--ink) }
.check input { width: 18px; height: 18px; accent-color: var(--ok) }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--paper);
  padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: .92rem; box-shadow: var(--shadow); max-width: calc(100% - 32px) }
@media (prefers-reduced-motion: no-preference) { .toast, .pop, .results { animation: up .15s ease-out } @keyframes up { from { opacity: 0; translate: 0 6px } } }
@media (max-width: 640px) { .brand, .pg-now { display: none } .doc { gap: 12px } }
</style>

function bboxOf(g) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
  (g.L || []).forEach(l => { add(l[0], l[1]); add(l[2], l[3]); });
  (g.C || []).forEach(c => { add(c[0] - c[2], c[1] - c[2]); add(c[0] + c[2], c[1] + c[2]); });
  (g.A || []).forEach(a => {
    const [cx, cy, r, s, e] = a; let en = e; if (en <= s) en += 360;
    add(cx + r * Math.cos(s * Math.PI / 180), cy + r * Math.sin(s * Math.PI / 180));
    add(cx + r * Math.cos(e * Math.PI / 180), cy + r * Math.sin(e * Math.PI / 180));
    for (let k = Math.ceil(s / 90) * 90; k < en; k += 90) add(cx + r * Math.cos(k * Math.PI / 180), cy + r * Math.sin(k * Math.PI / 180));

    return `${hd}<button type="button" class="novrow ${cls}" data-n="${i}"><i></i><span class="t"><b>${esc(codeOfId(n.conjunto))}</b>${esc(n.texto)}<small>${esc(isMine(n) ? 'Esta PC' : (n.quien || 'Otra PC'))}</small></span><span class="h">${esc(ago(n.en))}</span></button>`;
  }).join('');
  box.onclick = (e) => { const b = e.target.closest('[data-n]'); if (b) goNov(NOV.list.slice(0, 120)[+b.dataset.n]); };
}
function openNov() {
  NOV.seenOpen = NOV.seen;
  const u = unseen().length;
  const perm = ('Notification' in window) && Notification.permission === 'default';
  const el = openPop($('btnNov'), `<div class="ph">Novedades${u ? ` · <span style="color:var(--accent)">${u} nueva${u > 1 ? 's' : ''}</span>` : ''}</div>
    <div class="novlist" id="novList"></div>
    <div class="novfoot"><span>Esta PC: <button type="button" data-name>${esc(myName() || 'ponerle nombre')}</button></span>${perm ? '<button type="button" data-perm>Avisarme aunque esté en otra ventana</button>' : ''}</div>`, { wide: true });
  renderNovList(); markSeen();
  el.querySelector('[data-name]').onclick = () => { const v = prompt('Nombre de esta PC o puesto (ej.: Corte, Plegado, Oficina):', myName()); if (v != null && v.trim()) { setName(v.trim()); el.querySelector('[data-name]').textContent = v.trim(); } };
  const pb = el.querySelector('[data-perm]'); if (pb) pb.onclick = async () => { try { await Notification.requestPermission(); } catch (e) {} pb.remove(); };
}
async function startNov() {
  try {
    const { data, error } = await sb.from('novedades').select('*').order('en', { ascending: false }).limit(200);
    if (error) throw error;
    NOV.on = true; NOV.list = data || [];
    if (!NOV.seen) { NOV.seen = NOV.list[0] ? NOV.list[0].en : '0'; try { localStorage.setItem('rs_novSeen', NOV.seen); } catch (e) {} }
    paintBell(false);
    $('btnNov').onclick = () => { if (POP && POP.el.querySelector('#novList')) closePop(); else openNov(); };
    setInterval(() => { if (POP && POP.el.querySelector('#novList')) renderNovList(); }, 60000);
    sb.channel('novedades').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'novedades' }, (pl) => { if (pl.new) addNov(pl.new, true); }).subscribe();
  } catch (e) { NOV.on = false; console.warn('novedades no disponible', e); }
}
function writeFail(e) { console.error(e); toast(navigator.onLine ? 'No se pudo guardar. Probá de nuevo.' : 'Sin internet: no se guardó.'); }
function setLive(on, txt) { $('live').classList.toggle('on', on); $('liveTxt').textContent = txt; }
const catOrd = (c) => { const i = CATS.indexOf(c.categoria); return i < 0 ? 9 : i; };
function sortConjs(list) { return list.sort((a, b) => catOrd(a) - catOrd(b) || (a.marca || '').localeCompare(b.marca || '') || (isCode(b.codigo || b.id) - isCode(a.codigo || a.id)) || (a.codigo || a.id).localeCompare(b.codigo || b.id, 'es', { numeric: true })); }
async function reloadConj(cid) {
  const { data, error } = await sb.from('conjuntos').select('*').eq('id', cid); if (error || !data[0]) return;
  Object.assign(S.C[cid].conj, data[0]); relayout();
}
async function reloadPiezas(cid) {
  const { data, error } = await sb.from('piezas').select('*').eq('conjunto', cid); if (error) return;
  S.C[cid].piezas = data; relayout();
}
let lastSeen = new Set();
async function reloadCambios(cid) {
  const { data, error } = await sb.from('cambios').select('*').eq('conjunto', cid).order('n'); if (error) return;
  data.forEach(c => { if (!NOV.on && !lastSeen.has(c.id) && c.autor !== myName()) { const p = S.C[cid].piezas.find(x => x.id === c.pieza); toast(`Nuevo cambio ${c.n} en ${codeOf(S.C[cid].conj)}${p ? ' · ' + p.nombre : ''}${c.autor ? ' · ' + c.autor : ''}`); } lastSeen.add(c.id); });
  S.C[cid].cambios = data;
  if (!POP) rerenderWhere(pg => pg.conj === cid || pg.type !== 'sheet');
}
(async function start() {
  if (!window.supabase || CONFIG.SUPABASE_URL.startsWith('PEGAR')) { $('doc').innerHTML = '<div class="page"><div class="loading">Falta configurar la conexión a Supabase.</div></div>'; return; }
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  try {
    const [conjs, piezas, cambios] = await Promise.all([fetchAll('conjuntos', '*'), fetchAll('piezas', '*'), fetchAll('cambios', '*')]);
    S.conjs = sortConjs(conjs);
    S.conjs.forEach(c => S.C[c.id] = { conj: c, piezas: [], cambios: [] });
    piezas.forEach(p => S.C[p.conjunto] && S.C[p.conjunto].piezas.push(p));
    cambios.forEach(c => { lastSeen.add(c.id); S.C[c.conjunto] && S.C[c.conjunto].cambios.push(c); });
  } catch (e) { console.error(e); setLive(false, 'Sin conexión'); $('doc').innerHTML = '<div class="page"><div class="loading">No pude conectar con la base de datos. Revisá internet y recargá.</div></div>'; return; }
  buildDoc(); mountDoc(); if (S.zoom !== 1) applyZoom(S.zoom);
  const h = decodeURIComponent(location.hash.slice(1));
  if (/^p\d+$/.test(h)) goPage(+h.slice(1)); else if (h && S.C[h]) goPage(S.C[h].firstPage);
  let tC = {}, tP = {};
  startNov();
  sb.channel('todo')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'conjuntos' }, (pl) => { const id = (pl.new && pl.new.id) || (pl.old && pl.old.id); if (S.C[id]) reloadConj(id); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'piezas' }, (pl) => { const id = (pl.new && pl.new.conjunto) || (pl.old && pl.old.conjunto); if (!S.C[id]) return; clearTimeout(tP[id]); tP[id] = setTimeout(() => reloadPiezas(id), 300); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'cambios' }, (pl) => { const id = (pl.new && pl.new.conjunto) || (pl.old && pl.old.conjunto); if (!S.C[id]) return; clearTimeout(tC[id]); tC[id] = setTimeout(() => reloadCambios(id), 300); })
    .subscribe(st => setLive(st === 'SUBSCRIBED', st === 'SUBSCRIBED' ? 'En vivo' : 'Reconectando…'));
})();
</script>
